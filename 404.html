<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>First Domino has moved</title>

  <meta http-equiv="refresh" content="url=https://firstdomino.eu/">

  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      text-align: center;
      background: Canvas;
      color: CanvasText;
    }

    main {
      padding: 2rem;
      max-width: 600px;
    }

    h1 {
      margin-bottom: 0.5rem;
      font-size: 2rem;
    }

    p {
      opacity: 0.75;
      line-height: 1.6;
    }

    a {
      color: inherit;
      font-weight: 600;
    }
  </style>
</head>

<body>
  <main>
    <h1>We've moved.</h1>

    <p>
      The First Domino website is now available at
      <a href="https://firstdomino.eu/">firstdomino.eu</a>.
    </p>

    <p>You will be redirected automatically.</p>
  </main>

  <script>
      location.replace("https://firstdomino.eu/");
  </script>
</body>
</html>
